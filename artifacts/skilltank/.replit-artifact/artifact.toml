kind = "web"
previewPath = "/"
title = "SkillTank Student Dashboard"
description = "A student dashboard for managing a learning profile, tracking skill-building tasks, saving project ideas, and browsing sample internship opportunities."
version = "1.0.0"
id = "artifacts/skilltank"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20536

[services.development]
run = "pnpm --filter @workspace/skilltank run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skilltank", "run", "build" ]
serve = "static"
publicDir = "artifacts/skilltank/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20536"
BASE_PATH = "/"
